services:
  db:
    image: postgres:15
    container_name: f1_stats_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d f1_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: f1_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  service-news:
    build: ./backend/news-service
    container_name: f1_service_news
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://user:password@db:5432/f1_db

  service-stats:
    build: ./backend/stats-service
    container_name: f1_service_stats
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://user:password@db:5432/f1_db

  frontend:
    build: ./frontend
    container_name: f1_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - service-news
      - service-stats

volumes:
  postgres_data: